# OpenClaw is intentionally NOT a service here. Both reference implementations
# (the organiser's starter kit and our earlier get_mooving project) install and run
# OpenClaw directly on the host via its own installer, including for WhatsApp session
# linking. Containerizing that install is unproven and not worth the risk this early -
# see DEVELOPMENT.md "Why OpenClaw is not in Docker Compose". Only the deterministic
# backend (API + database) is containerized.
services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8090:8000"
    volumes:
      - ./businesses:/app/businesses:ro
      # Writable overall (the Calendar client rewrites calendar_token.json on
      # every access-token refresh - see integrations/google_calendar.py), but
      # the OAuth client secret itself is pinned read-only via the more
      # specific mount below (Docker resolves the longer path, so this one
      # wins for that single file regardless of declaration order).
      - ./credentials:/app/credentials
      - ./credentials/calendar_credentials.json:/app/credentials/calendar_credentials.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

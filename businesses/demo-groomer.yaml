# Demo business profile for the first vertical slice.
# Add a new business by creating another <business_id>.yaml here - do not
# edit the agent's generic rules (openclaw/workspace/skills/front-desk/SKILL.md)
# or the scheduling code to support a new business.
id: demo-groomer
name: 42 Grooming
timezone: Asia/Singapore

# The Google Calendar this business's availability is checked against and
# bookings are written to. Create/share this calendar with the service
# account or OAuth user configured via GOOGLE_CALENDAR_* env vars.
calendar_id: primary

address: "8 Somapah Road, Singapore 487372"

# Credentials/qualifications blurb, relayed verbatim by the agent when asked
# what the business offers or whether it's qualified for something specific
# (small animals, handstripping, etc.) - not itself a bookable service.
about: >
  Certified SKC (Singapore Kennel Club) and KCT groomers, certified K9 first
  responders. We offer bespoke trims, small animal grooming, and
  handstripping. By appointment only.

pricing_note: "Exact cost to be advised - prices below are starting estimates."

services:
  full_grooming:
    display_name: "Full Grooming"
    duration_minutes: 120
    turnaround_minutes: 60
    price_from: "S$60"
  basic_grooming:
    display_name: "Basic Grooming"
    duration_minutes: 120
    # Not separately confirmed - assumed same as full_grooming's turnaround
    # since it's the same 2-hour appointment length. Revisit if wrong.
    turnaround_minutes: 60
    price_from: "S$35"

# Priced extras with no appointment slot of their own - not bookable
# independently via search_availability/create_booking (see AddOnProfile).
add_ons:
  bath:
    display_name: "Bath"
    price_from: "S$25"
  strip_down:
    display_name: "Strip Down"
    price_from: "S$55"
  dematting:
    display_name: "Dematting"
    price_from: "S$35"
  ayurveda_herb_spa:
    display_name: "Ayurveda Herb Spa"
    price_from: "S$35"

opening_hours:
  monday: { open: "09:00", close: "18:00" }
  tuesday: { open: "09:00", close: "18:00" }
  wednesday: { open: "09:00", close: "18:00" }
  thursday: { open: "09:00", close: "18:00" }
  friday: { open: "09:00", close: "18:00" }
  saturday: { open: "09:00", close: "15:00" }
  # sunday: closed (omitted)

required_customer_fields:
  - name
  - phone

optional_customer_fields:
  - address
  - notes

slot_interval_minutes: 60
